version: 1.0
runtime: python311
build:
  commands:
    build:
      - echo "Installing system dependencies and Python packages"
      - cd backend
      - pip install --upgrade pip
      - pip install -r requirements.txt
run:
  command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
    env: APP_PORT
  env:
    - name: AWS_REGION
      value: us-east-1
    - name: BEDROCK_MODEL_ID
      value: us.anthropic.claude-3-5-sonnet-20241022-v2:0
    - name: STRANDS_DECIDER_URL
      value: http://localhost:8080/v1/system-one
    - name: STRANDS_DECIDER_TIMEOUT
      value: "1.5"
    - name: DECIDER_CONFIDENCE_THRESHOLD
      value: "0.65"
    - name: MAX_INVESTIGATION_STEPS
      value: "4"
    - name: CORS_ORIGINS
      value: "*"
